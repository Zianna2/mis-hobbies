<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo Frío Invierno: Azul Hielo y Nieve -->
    <linearGradient id="winterBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#D9E4EE"/>
    </linearGradient>

    <!-- Copo de Nieve Brillante -->
    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A9C7DF"/>
    </linearGradient>

    <!-- Bayas de Invierno (Acebo) -->
    <linearGradient id="berryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC3545"/>
      <stop offset="100%" stop-color="#841C27"/>
    </linearGradient>

    <filter id="softWinterShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#2D4059" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#winterBgGrad)"/>
  <circle cx="256" cy="256" r="200" fill="#F8FAFC" stroke="#C5D7E8" stroke-width="5" filter="url(#softWinterShadow)"/>
  <circle cx="256" cy="256" r="188" fill="none" stroke="#DDE7F0" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Destellos invernales -->
  <g fill="#7EA5C4" opacity="0.65">
    <circle cx="130" cy="150" r="5"/>
    <circle cx="380" cy="140" r="6"/>
    <circle cx="120" cy="360" r="4"/>
    <circle cx="390" cy="350" r="5"/>
  </g>

  <!-- Gran Copo de Nieve Central Escarchado -->
  <g transform="translate(256, 240)" stroke="#4A7599" stroke-width="8" stroke-linecap="round">
    <!-- Ejes principales -->
    <line x1="0" y1="-105" x2="0" y2="105"/>
    <line x1="-91" y1="-52" x2="91" y2="52"/>
    <line x1="-91" y1="52" x2="91" y2="-52"/>

    <!-- Ramificaciones de nieve en 6 puntas -->
    <!-- Arriba -->
    <path d="M -22,-65 L 0,-85 L 22,-65" fill="none"/>
    <path d="M -16,-38 L 0,-52 L 16,-38" fill="none"/>
    <!-- Abajo -->
    <path d="M -22,65 L 0,85 L 22,65" fill="none"/>
    <path d="M -16,38 L 0,52 L 16,38" fill="none"/>
    <!-- Diagonal Sup Der -->
    <g transform="rotate(60)">
      <path d="M -22,-65 L 0,-85 L 22,-65" fill="none"/>
      <path d="M -16,-38 L 0,-52 L 16,-38" fill="none"/>
      <path d="M -22,65 L 0,85 L 22,65" fill="none"/>
      <path d="M -16,38 L 0,52 L 16,38" fill="none"/>
    </g>
    <!-- Diagonal Sup Izq -->
    <g transform="rotate(120)">
      <path d="M -22,-65 L 0,-85 L 22,-65" fill="none"/>
      <path d="M -16,-38 L 0,-52 L 16,-38" fill="none"/>
      <path d="M -22,65 L 0,85 L 22,65" fill="none"/>
      <path d="M -16,38 L 0,52 L 16,38" fill="none"/>
    </g>
  </g>

  <!-- Centro del copo con gema de cristal -->
  <circle cx="256" cy="240" r="16" fill="#FFFFFF" stroke="#3D688D" stroke-width="4"/>
  <circle cx="256" cy="240" r="7" fill="#6997BF"/>

  <!-- Ramitas de acebo con bayas rojas en la base -->
  <!-- Hojas verdes de pino/acebo -->
  <g transform="translate(256, 385)">
    <path d="M 0,-15 C -35,-25 -65,0 -45,15 C -25,25 -5,5 0,-15 Z" fill="#2E5339"/>
    <path d="M 0,-15 C 35,-25 65,0 45,15 C 25,25 5,5 0,-15 Z" fill="#3D6B4A"/>
    <!-- Bayas rojas -->
    <circle cx="-14" cy="5" r="14" fill="url(#berryGrad)"/>
    <circle cx="14" cy="5" r="14" fill="url(#berryGrad)"/>
    <circle cx="0" cy="-6" r="15" fill="url(#berryGrad)"/>
    <!-- Brillos de las bayas -->
    <circle cx="-10" cy="1" r="3.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="18" cy="1" r="3.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="4" cy="-10" r="3.5" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>