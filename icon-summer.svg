<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo Verano: Sol Dorado y Melocotón Cálido -->
    <linearGradient id="summerBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="50%" stop-color="#FEF5E7"/>
      <stop offset="100%" stop-color="#FCE1BE"/>
    </linearGradient>

    <!-- Pétalos de Girasol / Sol Radiante -->
    <linearGradient id="sunflowerPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDD53"/>
      <stop offset="70%" stop-color="#FCA311"/>
      <stop offset="100%" stop-color="#E85D04"/>
    </linearGradient>

    <!-- Centro Semillas Girasol / Miel Tostada -->
    <radialGradient id="sunflowerCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8F4F24"/>
      <stop offset="75%" stop-color="#5B2E10"/>
      <stop offset="100%" stop-color="#381A07"/>
    </radialGradient>

    <filter id="softSummerShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#7C4700" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#summerBgGrad)"/>
  <circle cx="256" cy="256" r="200" fill="#FFFDF8" stroke="#F5D0A9" stroke-width="5" filter="url(#softSummerShadow)"/>
  <circle cx="256" cy="256" r="188" fill="none" stroke="#FCE7D2" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Rayos de sol suaves y destellos -->
  <g fill="#FBBF24" opacity="0.6">
    <circle cx="120" cy="140" r="6"/>
    <circle cx="390" cy="130" r="7"/>
    <circle cx="110" cy="380" r="5"/>
    <circle cx="400" cy="370" r="6"/>
  </g>

  <!-- Gran Girasol de Verano Soleado -->
  <g transform="translate(256, 256)">
    <!-- Pétalos exteriores radiantes (12 pétalos) -->
    <!-- Capa 1 -->
    <g>
      <path d="M 0,-40 C -18,-70 -16,-135 0,-145 C 16,-135 18,-70 0,-40 Z" fill="url(#sunflowerPetal)"/>
      <path d="M 0,-40 C -18,-70 -16,-135 0,-145 C 16,-135 18,-70 0,-40 Z" transform="rotate(30)" fill="url(#sunflowerPetal)"/>
      <path d="M 0,-40 C -18,-70 -16,-135 0,-145 C 16,-135 18,-70 0,-40 Z" transform="rotate(60)" fill="url(#sunflowerPetal)"/>
      <path d="M 0,-40 C -18,-70 -16,-135 0,-145 C 16,-135 18,-70 0,-40 Z" transform="rotate(90)" fill="url(#sunflowerPetal)"/>
      <path d="M 0,-40 C -18,-70 -16,-135 0,-145 C 16,-135 18,-70 0,-40 Z" transform="rotate(120)" fill="url(#sunflowerPetal)"/>
      <path d="M 0,-40 C -18,-70 -16,-135 0,-145 C 16,-135 18,-70 0,-40 Z" transform="rotate(150)" fill="url(#sunflowerPetal)"/>
      <path d="M 0,-40 C -18,-70 -16,-135 0,-145 C 16,-135 18,-70 0,-40 Z" transform="rotate(180)" fill="url(#sunflowerPetal)"/>
      <path d="M 0,-40 C -18,-70 -16,-135 0,-145 C 16,-135 18,-70 0,-40 Z" transform="rotate(210)" fill="url(#sunflowerPetal)"/>
      <path d="M 0,-40 C -18,-70 -16,-135 0,-145 C 16,-135 18,-70 0,-40 Z" transform="rotate(240)" fill="url(#sunflowerPetal)"/>
      <path d="M 0,-40 C -18,-70 -16,-135 0,-145 C 16,-135 18,-70 0,-40 Z" transform="rotate(270)" fill="url(#sunflowerPetal)"/>
      <path d="M 0,-40 C -18,-70 -16,-135 0,-145 C 16,-135 18,-70 0,-40 Z" transform="rotate(300)" fill="url(#sunflowerPetal)"/>
      <path d="M 0,-40 C -18,-70 -16,-135 0,-145 C 16,-135 18,-70 0,-40 Z" transform="rotate(330)" fill="url(#sunflowerPetal)"/>
    </g>

    <!-- Centro de Semillas de Girasol -->
    <circle cx="0" cy="0" r="54" fill="url(#sunflowerCenter)"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#E59866" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#E59866" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#E59866" stroke-width="2" stroke-dasharray="3 3" opacity="0.6"/>
  </g>

  <!-- Pequeña abejita amigable volando -->
  <g transform="translate(350, 160) rotate(-15)">
    <!-- Alitas transparentes -->
    <ellipse cx="2" cy="-14" rx="7" ry="12" fill="#E0F2FE" opacity="0.8" transform="rotate(20 2 -14)"/>
    <ellipse cx="12" cy="-14" rx="6" ry="10" fill="#E0F2FE" opacity="0.8" transform="rotate(-15 12 -14)"/>
    <!-- Cuerpo abejita a rayas -->
    <ellipse cx="6" cy="0" rx="14" ry="10" fill="#FBBF24"/>
    <path d="M 0,-10 L 0,10" stroke="#1F2937" stroke-width="3"/>
    <path d="M 6,-10 L 6,10" stroke="#1F2937" stroke-width="3"/>
    <path d="M 12,-9 L 12,9" stroke="#1F2937" stroke-width="2.5"/>
  </g>
</svg>