<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Paleta Cozy Otoño / Hogar Cálido -->
    <linearGradient id="bgCozyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="50%" stop-color="#F5EFE6"/>
      <stop offset="100%" stop-color="#EBDDCB"/>
    </linearGradient>
    
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97443"/>
      <stop offset="100%" stop-color="#B85128"/>
    </linearGradient>

    <linearGradient id="yarnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E29578"/>
      <stop offset="100%" stop-color="#C86D51"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#5E3023" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Fondo squircle suave -->
  <rect width="512" height="512" rx="130" fill="url(#bgCozyGrad)"/>
  
  <!-- Círculo interior de cerámica crema con sombra suave -->
  <circle cx="256" cy="256" r="185" fill="#FAF6EE" stroke="#E6D7C3" stroke-width="6" filter="url(#softShadow)"/>

  <!-- Corona floral / hojas acogedoras sutiles -->
  <g opacity="0.85">
    <!-- Hojita izquierda -->
    <path d="M 140,240 C 120,210 135,175 165,185 C 165,215 155,235 140,240 Z" fill="#DDB892"/>
    <!-- Hojita derecha -->
    <path d="M 372,240 C 392,210 377,175 347,185 C 347,215 357,235 372,240 Z" fill="#DDB892"/>
    <!-- Estrellitas destello Diamond -->
    <path d="M 350,140 L 356,155 L 371,161 L 356,167 L 350,182 L 344,167 L 329,161 L 344,155 Z" fill="#84A59D"/>
    <path d="M 160,320 L 165,332 L 177,337 L 165,342 L 160,354 L 155,342 L 143,337 L 155,332 Z" fill="#E07A5F"/>
  </g>

  <!-- Ovillo de lana acogedor (Craft / Crochet) -->
  <circle cx="225" cy="270" r="82" fill="url(#yarnGrad)"/>
  <!-- Hebras de lana curvas suaves -->
  <path d="M 165,245 Q 225,210 285,250" stroke="#FFF0EB" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 160,275 Q 225,245 290,285" stroke="#FFF0EB" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 180,305 Q 235,280 275,320" stroke="#FFF0EB" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- Aguja de tejer / ganchillo de madera cruzada -->
  <line x1="130" y1="365" x2="310" y2="185" stroke="#7F5539" stroke-width="9" stroke-linecap="round"/>
  <circle cx="125" cy="370" r="11" fill="#9C6644"/>

  <!-- Base de libro abierto / Diario de hobbies -->
  <path d="M 230,332 Q 285,320 340,330 L 335,360 Q 285,350 230,362 Z" fill="#FFFFFF" stroke="#E6D7C3" stroke-width="3"/>
  <path d="M 340,330 Q 395,320 445,332 L 445,362 Q 395,350 340,360 Z" fill="#FFFDF9" stroke="#E6D7C3" stroke-width="3" opacity="0.95"/>

  <!-- Diamante centelleante (Diamond Painting) -->
  <g transform="translate(315, 230) scale(0.9)">
    <polygon points="40,0 70,25 55,65 25,65 10,25" fill="#84A59D"/>
    <polygon points="40,0 55,65 25,65" fill="#A5C4BD" opacity="0.8"/>
    <polygon points="40,0 25,65 10,25" fill="#6A8D85" opacity="0.6"/>
    <polygon points="40,0 70,25 55,65" fill="#BCE0D8" opacity="0.9"/>
  </g>

  <!-- Hilo con forma de corazón cozy que sale del ovillo -->
  <path d="M 290,265 C 310,240 330,245 325,270 C 320,290 285,310 275,320 C 265,310 235,290 230,270 C 225,245 245,240 265,265 Z" fill="#D97443" opacity="0.85"/>

  <!-- Vapor / Volutas mágicas de té caliente arriba -->
  <path d="M 245,170 Q 255,145 245,125" stroke="#DDB892" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 270,165 Q 280,140 270,118" stroke="#DDB892" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7"/>
</svg>
