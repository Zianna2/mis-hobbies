<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F2ECE1"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E78B74"/>
      <stop offset="100%" stop-color="#D96950"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#733B2E" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Main emblem circle with shadow -->
  <circle cx="256" cy="256" r="180" fill="url(#circleGrad)" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="150" fill="#FFFBF5" opacity="0.95"/>

  <!-- Central Craft Emblems: Yarn ball, Diamond sparkle, Book -->
  <!-- Yarn loop / Heart shape symbolizing handmade craft -->
  <path d="M 256,180 C 230,135 170,140 170,200 C 170,250 240,300 256,325 C 272,300 342,250 342,200 C 342,140 282,135 256,180 Z" fill="#E07A5F" />
  
  <!-- Diamond sparkle top right -->
  <path d="M 340,160 L 352,185 L 377,197 L 352,209 L 340,234 L 328,209 L 303,197 L 328,185 Z" fill="#81B29A" />
  
  <!-- Tiny sparkle bottom left -->
  <path d="M 180,280 L 188,298 L 206,306 L 188,314 L 180,332 L 172,314 L 154,306 L 172,298 Z" fill="#F2CC8F" />

  <!-- Yarn texture thread curve -->
  <path d="M 210,210 Q 256,260 302,210" stroke="#FFFBF5" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 220,230 Q 256,275 292,230" stroke="#FFFBF5" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"/>
</svg>
